type UserSkill {
  id: ID!
  userId: String!
  user: User!
  skillId: String!
  skill: Skill!
  skillRole: SkillRole!
  proficiency: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

input CreateUserSkillInput {
  userId: String!
  skillId: String!
  skillRole: SkillRole!
  proficiency: Int!
}

input UpdateUserSkillInput {
  skillRole: SkillRole
  proficiency: Int
}

type Query {
  userSkillById(id: ObjectID!): UserSkill
  userSkillsByUserId(userId: String!): [UserSkill!]!
  userSkillsBySkillId(skillId: String!): [UserSkill!]!
  userSkills: [UserSkill!]!
}

type Mutation {
  createUserSkill(input: CreateUserSkillInput!): UserSkill!
  updateUserSkill(id: ObjectID!, input: UpdateUserSkillInput!): UserSkill!
  deleteUserSkill(id: ObjectID!): Boolean!
}

enum SkillRole {
  teacher
  student
}
