type StudentProfile {
  id: PostgresID!
  userId: String!
  skills: [StudentSkill!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

input UpdateStudentProfileInput {
  skills: [StudentSkillInput!]
}

type Query {
  studentProfiles: [StudentProfile!]!
  studentProfileById(id: PostgresID!): StudentProfile
}

type Mutation {
  updateStudentProfile(
    id: PostgresID!
    input: UpdateStudentProfileInput!
  ): StudentProfile!
}
