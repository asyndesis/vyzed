# Type Definitions
type User {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  imageUrl: String
  roles: [String!]!
  authId: String!
  userSkills: [UserSkill!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

# Input Types
input CreateUserInput {
  email: String!
  firstName: String
  lastName: String
  imageUrl: String
  roles: [String!]
  authId: String!
}

input UpdateUserInput {
  email: String
  firstName: String
  lastName: String
  imageUrl: String
  roles: [String!]
}

# Queries
type Query {
  me: User
  userById(id: ObjectID!): User
  userByAuthId(authId: String!): User
  checkUserExistsByAuthId(authId: String!): Boolean!
  users: [User!]!
  getTeachers: [User!]!
}

# Mutations
type Mutation {
  createMyUser(input: CreateUserInput!): User!
  createUser(input: CreateUserInput!): User!
  updateUser(id: ObjectID!, input: UpdateUserInput!): User!
  deleteUser(id: ObjectID!): Boolean!
}
