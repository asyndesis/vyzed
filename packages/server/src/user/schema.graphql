# Type Definitions
type User {
  id: PostgresID!
  email: String!
  firstName: String
  lastName: String
  lastInitial: String
  imageUrl: String
  roles: [String!]!
  authId: String!
  studentProfile: StudentProfile
  teacherProfile: TeacherProfile
  userProfile: UserProfile
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

type PublicUser {
  id: PostgresID!
  firstName: String
  lastInitial: String
  imageUrl: String
  createdAt: DateTime!
  studentProfile: StudentProfile
  teacherProfile: TeacherProfile
  userProfile: UserProfile
}

# Input Types
input CreateUserInput {
  email: String!
  firstName: String
  lastName: String
  imageUrl: String
  roles: [String!]
  authId: String!
}

input UpdateUserInput {
  email: String
  firstName: String
  lastName: String
  imageUrl: String
  roles: [String!]
}

# Queries
type Query {
  me: User
  userById(id: PostgresID!): User
  userByAuthId(authId: String!): User
  checkUserExistsByAuthId(authId: String!): Boolean!
  users: [User!]!
  publicUserById(id: PostgresID!): PublicUser
  publicTeacherUsers(
    skillIds: [ID!]
    pagination: PaginationInput
  ): TeacherUserResult!
}

# Mutations
type Mutation {
  createMyUser(input: CreateUserInput!): User!
  createUser(input: CreateUserInput!): User!
  updateUser(id: PostgresID!, input: UpdateUserInput!): User!
  deleteUser(id: PostgresID!): Boolean!
}

# Paginated response type
type TeacherUserResult {
  users: [PublicUser!]!
  pagination: PaginationInfo!
}
