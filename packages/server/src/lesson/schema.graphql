# Type Definitions
type Lesson {
  id: PostgresID!
  startTime: DateTime!
  endTime: DateTime!
  teacherId: PostgresID!
  teacher: PublicUser!
  skillId: PostgresID!
  skill: Skill!
  proficiency: Int!
  maxStudents: Int!
  status: LessonStatus!
  enrollments: [Enrollment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

type Enrollment {
  id: PostgresID!
  lessonId: PostgresID!
  lesson: Lesson!
  studentId: PostgresID!
  student: PublicUser!
  paymentType: PaymentType!
  paymentAmount: Int
  paymentCurrency: String
  barterLessonId: PostgresID
  status: LessonStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input Types
input RequestLessonInput {
  startTime: DateTime!
  teacherId: PostgresID!
  skillId: PostgresID!
  proficiency: Int!
  paymentType: PaymentType!
  paymentAmount: Int
  paymentCurrency: String
  barterLessonId: PostgresID
}

# Queries
extend type Query {
  myLessonsAsStudent: [Lesson!]!
  myLessonsAsTeacher: [Lesson!]!
}

# Mutations
extend type Mutation {
  # Student actions
  requestLesson(input: RequestLessonInput!): Lesson!
  # Teacher actions
  approveLesson(lessonId: PostgresID!): Lesson!
  rejectLesson(lessonId: PostgresID!): Lesson!
}
