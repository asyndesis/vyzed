# Type Definitions
type UserSchedule {
  id: PostgresID!
  userId: PostgresID!
  user: User!
  slots: [UserScheduleSlot!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

type UserScheduleSlot {
  id: PostgresID!
  userScheduleId: PostgresID!
  userSchedule: UserSchedule!
  dayOfWeek: DayOfWeek
  type: UserScheduleSlotType!
  startTime: DateTime!
  endTime: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

input UserScheduleSlotInput {
  id: PostgresID
  dayOfWeek: DayOfWeek
  type: UserScheduleSlotType!
  startTime: DateTime!
  endTime: DateTime!
}

# Queries
type Query {
  userSchedule(userId: PostgresID!): UserSchedule
}

# Mutations
type Mutation {
  # Bulk update a user's schedule slots
  updateUserScheduleSlots(
    userScheduleId: PostgresID!
    slots: [UserScheduleSlotInput!]!
  ): [UserScheduleSlot!]!
}
