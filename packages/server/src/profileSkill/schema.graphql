# Type Definitions
type ProfileSkill {
  id: ID!
  profileId: String!
  profile: Profile!
  skillId: String!
  skill: Skill!
  proficiency: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input Types
input CreateProfileSkillInput {
  profileId: String!
  skillId: String!
  proficiency: Int!
}

input UpdateProfileSkillInput {
  profileId: String
  skillId: String
  proficiency: Int
}

# Queries
type Query {
  profileSkillById(id: ObjectID!): ProfileSkill
  profileSkillsByProfileId(profileId: String!): [ProfileSkill!]!
  profileSkillsBySkillId(skillId: String!): [ProfileSkill!]!
  profileSkills: [ProfileSkill!]!
}

# Mutations
type Mutation {
  createProfileSkill(input: CreateProfileSkillInput!): ProfileSkill!
  updateProfileSkill(
    id: ObjectID!
    input: UpdateProfileSkillInput!
  ): ProfileSkill!
  deleteProfileSkill(id: ObjectID!): Boolean!
}
