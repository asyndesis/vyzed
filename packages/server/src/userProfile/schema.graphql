type UserProfile {
  id: PostgresID!
  userId: PostgresID!
  bio: String
  languages: [UserLanguage!]
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

input UpdateUserProfileInput {
  bio: String
  languages: [UserLanguageInput!]
}

type Query {
  userProfiles: [UserProfile!]!
  userProfileById(id: PostgresID!): UserProfile
  userProfileByUserId(userId: PostgresID!): UserProfile
}

type Mutation {
  updateUserProfile(
    id: PostgresID!
    input: UpdateUserProfileInput!
  ): UserProfile!
}
