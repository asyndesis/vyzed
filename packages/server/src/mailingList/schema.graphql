# Type Definitions
type MailingList {
  id: PostgresID!
  email: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

# Input Types
input AddToMailingListInput {
  email: String!
}

# Mutations
type Mutation {
  addToMailingList(input: AddToMailingListInput!): Boolean!
}
