type TeacherProfile {
  id: PostgresID!
  userId: PostgresID!
  skills: [TeacherSkill!]!
  priceAmount: Int
  priceCurrency: String
  allowBarter: Boolean
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

input UpdateTeacherProfileInput {
  skills: [TeacherSkillInput!]
  priceAmount: Int
  priceCurrency: String
  allowBarter: Boolean
}

extend type Query {
  teacherProfileById(id: PostgresID!): TeacherProfile
}

extend type Mutation {
  updateTeacherProfile(
    id: PostgresID!
    input: UpdateTeacherProfileInput!
  ): TeacherProfile!
}
