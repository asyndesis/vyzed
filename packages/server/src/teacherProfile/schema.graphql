type TeacherProfile {
  id: PostgresID!
  userId: String!
  user: PrivateUser!
  bio: String
  skills: [TeacherSkill!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

input CreateTeacherProfileInput {
  userId: String!
  bio: String
}

input UpdateTeacherProfileInput {
  bio: String
  skills: [TeacherSkillInput!]
}

extend type Query {
  teacherProfiles: [TeacherProfile!]!
  teacherProfileById(id: PostgresID!): TeacherProfile
  teacherProfileByUserId(userId: String!): TeacherProfile
}

extend type Mutation {
  createTeacherProfile(input: CreateTeacherProfileInput!): TeacherProfile!
  updateTeacherProfile(
    id: PostgresID!
    input: UpdateTeacherProfileInput!
  ): TeacherProfile!
  deleteTeacherProfile(id: PostgresID!): Boolean!
}
