type Sequence {
  id: ObjectID!
  name: String
  species: String
  sequenceBatchId: ObjectID
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

input CreateSequenceInput {
  name: String
  species: String
  sequenceBatchId: ObjectID
}

input UpdateSequenceInput {
  name: String
  species: String
  sequenceBatchId: ObjectID
}

type Query {
  sequences: [Sequence!]!
  sequence(id: ObjectID!): Sequence
}

type Mutation {
  createSequence(input: CreateSequenceInput!): Sequence
  updateSequence(id: ObjectID!, input: UpdateSequenceInput!): Sequence
}
