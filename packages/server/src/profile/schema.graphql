# Type Definitions
type Profile {
  id: ID!
  userId: String!
  user: User!
  profileSkills: [ProfileSkill!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input Types
input CreateProfileInput {
  userId: String!
}

input UpdateProfileInput {
  userId: String
}

# Queries
type Query {
  profileById(id: ObjectID!): Profile
  profilesByUserId(userId: String!): [Profile!]!
  profiles: [Profile!]!
}

# Mutations
type Mutation {
  createProfile(input: CreateProfileInput!): Profile!
  updateProfile(id: ObjectID!, input: UpdateProfileInput!): Profile!
  deleteProfile(id: ObjectID!): Boolean!
}
