# Type Definitions
type Skill {
  id: PostgresID!
  name: String!
  parentId: PostgresID
  parent: Skill
  children: [Skill!]!
  teacherSkills: [TeacherSkill!]!
  studentSkills: [StudentSkill!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: PostgresID
  updatedBy: PostgresID
}

# Input Types
input CreateSkillInput {
  name: String!
  parentId: PostgresID
}

input UpdateSkillInput {
  name: String
  parentId: PostgresID
}

# Queries
type Query {
  skillById(id: PostgresID!): Skill
  skillsByParentId(parentId: PostgresID): [Skill!]!
  rootSkills: [Skill!]!
  allSkills: [Skill!]!
}

# Mutations
type Mutation {
  createSkill(input: CreateSkillInput!): Skill!
  updateSkill(id: PostgresID!, input: UpdateSkillInput!): Skill!
  deleteSkill(id: PostgresID!): Boolean!
}
