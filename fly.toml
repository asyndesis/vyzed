# See https://fly.io/docs/reference/configuration/
app = 'vyzed'
primary_region = 'cdg' # Paris — closest region to Spain (Madrid was retired)
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[deploy]
release_command = 'node scripts/migrate.mjs'

[env]
NODE_ENV = 'production'
BETTER_AUTH_URL = 'https://vyzed.fly.dev'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = '30s'
interval = '15s'
method = 'GET'
path = '/api/health'
timeout = '5s'

[[vm]]
size = 'shared-cpu-1x'
memory = '1gb'
