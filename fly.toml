# fly.toml app configuration file generated for vyzed on 2025-03-24T19:44:53+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vyzed'
primary_region = 'mad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http', 'tls']

    [services.ports.tls_options]
      alpn = ['http/1.1', 'h2']

[[services]]
  protocol = 'tcp'
  internal_port = 4000
  processes = ['app']

  [[services.ports]]
    port = 8080
    handlers = ['http', 'tls']

    [services.ports.tls_options]
      alpn = ['http/1.1', 'h2']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
