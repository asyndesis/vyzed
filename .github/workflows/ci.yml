name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job per gate, run in parallel, so a single run reports every failure.
  # Job names are required checks in branch protection; rename both together.
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format, lint, types
            run: npm run check:format && npm run lint && npm run typecheck
          - name: File names
            run: npm run check:names
          - name: Tests
            run: npm run test
          - name: Generated files
            run: npm run check:generated
          - name: Build
            run: npm run build
    env:
      # No secrets in CI; the same switch the Docker build uses
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  # Ship main once every gate is green. Migrations run via fly.toml's release_command.
  deploy:
    name: Deploy
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
